services:
  test-db:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: mining_test
      POSTGRES_PASSWORD: mining_test_local
      POSTGRES_DB: mining_test
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mining_test -d mining_test"]
      interval: 5s
      timeout: 5s
      retries: 10
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mining
      POSTGRES_PASSWORD: mining_local
      POSTGRES_DB: mining
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mining -d mining"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
